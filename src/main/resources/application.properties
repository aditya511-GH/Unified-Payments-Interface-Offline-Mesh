# Render and other hosts provide PORT. Local development defaults to 8080.
server.port=${PORT:8080}
server.error.include-message=never

# Demo-only, in-memory database. All accounts and transactions reset on restart.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:upimesh}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Keep the H2 console disabled by default, including on public deployments.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Logging
logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Idempotency and packet freshness windows
upi.mesh.idempotency-ttl-seconds=86400
upi.mesh.packet-max-age-seconds=86400
upi.demo.expected-pin-hash=${DEMO_PIN_HASH:03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4}
